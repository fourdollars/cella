name: Release prebuilt binary

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    name: release linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      env:
        GOOS: linux
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      run: |
        go build -trimpath -ldflags="-s -w" -o cella_linux_${{ matrix.goarch }} ./cmd/

    - name: SHA256
      run: sha256sum cella_linux_${{ matrix.goarch }} > cella_linux_${{ matrix.goarch }}.sha256

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          cella_linux_${{ matrix.goarch }}
          cella_linux_${{ matrix.goarch }}.sha256
